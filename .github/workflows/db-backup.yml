name: Database Backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-backup:
    name: Backup Production Database
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          for var in DATABASE_URL S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!var}" ]; then
              echo "::error::Required secret missing: ${var}"
              exit 1
            fi
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Dump Database and Upload to S3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d_%H-%M-%S")
          BACKUP_FILENAME="db_backup_${TIMESTAMP}.sql.gz"

          echo "[INFO] Running pg_dump via Docker (Postgres 17) and compressing..."
          docker run --rm postgres:17 pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILENAME"

          echo "[INFO] Uploading archive to AWS S3 bucket destination..."
          aws s3 cp "$BACKUP_FILENAME" "s3://${S3_BUCKET}/backups/${BACKUP_FILENAME}" --only-show-errors

          echo "[INFO] Backup process completed successfully!"
