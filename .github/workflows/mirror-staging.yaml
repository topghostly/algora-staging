name: Mirror staging to personal repo

on:
  push:
    branches:
      - staging

permissions:
  contents: read # IMPORTANT: disable implicit write token

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          persist-credentials: false # 🔥 disables GITHUB_TOKEN

      - name: Configure git
        run: |
          git config --global user.name "topghostly"
          git config --global user.email "topghostly@users.noreply.github.com"

      - name: Add personal remote
        env:
          PERSONAL_GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote add personal https://x-access-token:${PERSONAL_GITHUB_TOKEN}@github.com/topghostly/algora-staging.git

      - name: Push staging
        run: |
          git push personal staging:staging
