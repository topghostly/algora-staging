name: Mirror staging to personal repo

on:
  push:
    branches:
      - staging

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0 # important for mirroring

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Add personal repo as remote
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          git remote remove personal || true
          git remote add personal https://x-access-token:${PERSONAL_TOKEN}@github.com/topghostly/algora-staging.git

      - name: Push staging to personal repo
        run: |
          git push personal staging:staging
